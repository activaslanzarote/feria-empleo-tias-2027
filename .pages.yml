- name: patrocinadores
  label: 🏛️ Organiza y patrocinan
  type: file
  path: contenido/patrocinadores.json
  format: json
  fields:
  - name: mostrar
    label: Mostrar esta sección en la web
    type: boolean
  - name: organiza_titulo
    label: Título «Organiza»
    type: string
  - name: organiza_logo
    label: Logo de quien organiza
    type: image
  - name: organiza_nombre
    label: Nombre de quien organiza
    type: string
  - name: patrocinan_titulo
    label: Título «Patrocinan»
    type: string
  - name: logos
    label: Logos de patrocinadores
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{fields.nombre}'
    fields:
    - name: imagen
      label: Logo
      type: image
    - name: nombre
      label: Nombre
      type: string
    - name: ancho
      label: Logo apaisado (más bajo)
      type: boolean
    - name: enlace
      label: Web (opcional)
      type: string
